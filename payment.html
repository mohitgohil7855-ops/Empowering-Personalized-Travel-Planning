<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobeTrotter - Payment</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 min-h-screen"><main class="max-w-xl mx-auto p-8"><div class="bg-white rounded-3xl p-8 shadow"><h1 class="text-3xl font-bold mb-2">Complete payment</h1><p class="text-slate-500 mb-6">Demo checkout for the hackathon.</p><label class="block mb-4">Trip ID<input id="trip_id" type="number" class="w-full border rounded-xl p-3 mt-2"></label><label class="block mb-4">Amount<input id="amount" type="number" value="100" class="w-full border rounded-xl p-3 mt-2"></label><label class="block mb-6">Currency<select id="currency" class="w-full border rounded-xl p-3 mt-2"><option>USD</option><option>INR</option><option>EUR</option></select></label><button id="pay" class="w-full bg-sky-700 text-white p-3 rounded-xl font-bold">Pay Now</button><p id="msg" class="mt-4"></p></div></main><script src="app.js"></script><script>(async()=>{document.getElementById('pay').onclick=async()=>{try{const r=await fetch('/api/payment/checkout',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({trip_id:Number(document.getElementById('trip_id').value)||null,amount:Number(document.getElementById('amount').value),currency:document.getElementById('currency').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.href=d.success_url}catch(e){document.getElementById('msg').textContent=e.message}}})();</script></body></html>
