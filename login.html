<form id="loginForm" class="space-y-4" action="/api/login" method="POST">
<!-- Joined Input Group -->
<div class="border border-outline rounded-[12px] overflow-hidden focus-within:ring-2 focus-within:ring-primary focus-within:border-primary transition-all">
<!-- Username/Email -->

                            Username or Email

</div>
<!-- Password -->
<div class="floating-input relative h-14 bg-surface">
<input class="w-full h-full pt-5 px-4 pb-1 bg-transparent border-none text-on-surface font-body-md text-body-md" id="password" placeholder=" " required="" type="password"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md text-body-md transition-all duration-200 pointer-events-none origin-left" for="password">
                            Password

</div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">
                    We'll call or text you to confirm your number. Standard message and data rates apply. <a class="font-bold underline hover:text-on-surface" href="#">Privacy Policy</a>

<script>
document.getElementById('loginForm')?.addEventListener('submit', async (event) => {
    event.preventDefault();

    const identifier = document.getElementById('identifier').value.trim();
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, password })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || 'Login failed.');
            return;
        }

        // Backend can return the logged-in user here.
        localStorage.setItem('globetrotterUser', JSON.stringify(data.user));
        window.location.href = 'index.html';
    } catch (error) {
        alert('Backend server is not running. Start the server and try again.');
    }
});
</script>
