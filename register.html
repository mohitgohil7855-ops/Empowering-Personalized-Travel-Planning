            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-lg md:p-xxxl relative overflow-hidden">
<!-- Background Decor (Minimalist) -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-[url('placeholder')] bg-cover bg-center mix-blend-multiply" data-alt="A subtle, highly desaturated, abstract map texture in light grey, providing a minimalist backdrop for a travel application. The aesthetic is clean and modern, ensuring high legibility for foreground elements. Light mode, airy, spacious."></div>
<!-- Main Card container -->
<div class="relative z-10 w-full max-w-3xl bg-surface-container-lowest rounded-xl shadow-[0px_12px_24px_rgba(0,0,0,0.15)] overflow-hidden border border-surface-variant flex flex-col md:flex-row">
<!-- Left Side: Image (Desktop only) -->
<div class="hidden md:block md:w-5/12 bg-surface-container-low relative">
<img class="absolute inset-0 w-full h-full object-cover" data-alt="A vertical portrait orientation photo of a serene, modern travel destination. Perhaps a coastal village or a quiet mountain retreat, shot in high-key lighting with a warm, inviting atmosphere. The palette is soft with hints of coral and teal. Optimistic, airy, premium quality." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCIA7lXGoQLbTIPkBmdDzKX-H0BUgAxxAP66aM6MVvTTOzY7TJwSr8nu5UvKGIoQogI02VomJCjVRxFKtdxSX5AMw9_a51b8TlcwLYkgavOLSPcC0QGq0hAmqiN5xPeyz2R590u-XnvViSJodQWZOCzpXn3Tqsxu9yEeJdF3VpQCB4Ovi9ACcrhjKR3QdWWkF-70dmvlYxtZS04iiTgCfvae3Wq8NXftjaeaDEDNLDXmr8xDFYlQqc4"/>
</div>
<!-- Right Side: Form -->
<div class="w-full md:w-7/12 p-xl flex flex-col">
<div class="mb-lg text-center md:text-left">
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-on-surface mb-xs">Create an Account</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Join GlobeTrotter to plan your next adventure.</p>
</div>
<form id="registerForm" class="flex flex-col gap-lg flex-grow" action="/api/register" method="POST">
<!-- Profile Photo Upload -->
<div class="flex justify-center md:justify-start items-center gap-md">
<div class="w-24 h-24 rounded-full bg-surface-container flex items-center justify-center border border-outline-variant overflow-hidden cursor-pointer hover:bg-surface-container-high transition-colors group relative">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors text-3xl">add_a_photo</span>
<input accept="image/*" aria-label="Upload Profile Photo" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" type="file"/>
</div>
<div class="flex flex-col">
<span class="text-label-md font-label-md text-on-surface">Profile Photo</span>
<span class="text-body-sm font-body-sm text-on-surface-variant">Recommended: 256x256px</span>
</div>
</div>
<!-- 2-Column Grid for Inputs -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- First Name -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="firstName">First Name</label>
<input class="h-12 rounded-lg border border-outline-variant px-md bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow text-body-md font-body-md placeholder:text-on-surface-variant/50" id="firstName" placeholder="Jane" type="text"/>
</div>
<!-- Last Name -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="lastName">Last Name</label>
<input class="h-12 rounded-lg border border-outline-variant px-md bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow text-body-md font-body-md placeholder:text-on-surface-variant/50" id="lastName" placeholder="Doe" type="text"/>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="email">Email Address</label>
<input class="h-12 rounded-lg border border-outline-variant px-md bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow text-body-md font-body-md placeholder:text-on-surface-variant/50" id="email" placeholder="jane@example.com" type="email"/>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="phone">Phone Number</label>
<input class="h-12 rounded-lg border border-outline-variant px-md bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow text-body-md font-body-md placeholder:text-on-surface-variant/50" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<!-- City -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="city">City</label>
<input class="h-12 rounded-lg border border-outline-variant px-md bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow text-body-md font-body-md placeholder:text-on-surface-variant/50" id="city" placeholder="New York" type="text"/>
</div>
<!-- Country -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="country">Country</label>
<div class="relative">
<select class="appearance-none h-12 w-full rounded-lg border border-outline-variant pl-md pr-[40px] bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow text-body-md font-body-md" id="country">
<option disabled="" selected="" value="">Select a country</option>
<option value="US">United States</option>
<option value="UK">United Kingdom</option>
<option value="CA">Canada</option>
<option value="AU">Australia</option>
<option value="FR">France</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Text Area -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="preferences">Additional Information / Travel Preferences</label>
<textarea class="rounded-lg border border-outline-variant p-md bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow text-body-md font-body-md resize-none placeholder:text-on-surface-variant/50" id="preferences" placeholder="Tell us what kind of places you love..." rows="3"></textarea>
</div>
<!-- Submit Button -->
<div class="pt-sm mt-auto">
<button class="w-full h-[48px] bg-[#FF385C] hover:bg-[#E00B41] text-[#FFFFFF] rounded-xl text-label-md font-label-md font-bold transition-all hover:shadow-[0px_6px_16px_rgba(0,0,0,0.12)] active:scale-[0.98]" type="submit">
                        Register
                    </button>
</div>
</form>
<div class="mt-lg text-center md:text-left">
<a class="text-body-sm font-body-sm text-on-surface-variant hover:text-primary hover:underline transition-colors" href="login.html">
                    Already have an account? Login here.
                </a>
</div>
</div>
</div>

<script>
document.getElementById('registerForm')?.addEventListener('submit', async (event) => {
    event.preventDefault();

    const payload = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        city: document.getElementById('city').value.trim(),
        country: document.getElementById('country').value,
        preferences: document.getElementById('preferences').value.trim()
    };

    if (!payload.firstName || !payload.lastName || !payload.email || !payload.phone || !payload.city || !payload.country) {
        alert('Please fill all required fields.');
        return;
    }

    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || 'Registration failed.');
            return;
        }

        alert('Registration successful! Please login.');
        window.location.href = 'login.html';
    } catch (error) {
        alert('Backend server is not running. Start the server and try again.');
    }
});
</script>

</body></html>
