</div>
</div>
<!-- Right Side: Registration Form -->
<div class="w-full md:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface">
<div class="w-full max-w-[440px] space-y-lg">
<!-- Logo & Header -->
<div class="text-center space-y-md">
<a href="{{DATA:SCREEN:SCREEN_30}}" class="block">
<img alt="GlobeTrotter Logo" class="h-16 w-16 mx-auto rounded-full shadow-sm object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1WgzWuHvBhtbYAAWEgdGKHA3IUYEeRfjwZIdKxqNUGAdVzu4ruU29jdc0e2BVPRwKOiimATSCuOa_qm-frMv-8odsuRXsTrUvxB1n98ARWDoHTXyCmsqekJVg01b0UvvWHYWfGMJYtaUnMoEX-NF4o96M6AlYqs30eseSarxBEPEoisnTeauTOjzKacCEhCzD3Uh80Z2ObRmr62wjgq4p3i11z7WYZgvs9pRlP61-TlmBDhDugOLQiLeN4S">

<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Start planning your dream itinerary.</p>
</div>

<!-- Form -->
<form class="space-y-md">
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-[20px]">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text">
</div>
</div>
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="jane@example.com" required="" type="email">
</div>
</div>
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-[20px]">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<a href="{{DATA:SCREEN:SCREEN_27}}" class="w-full py-3 px-4 bg-primary text-on-primary rounded-lg font-label-bold text-label-bold hover:opacity-90 transition-opacity active:scale-[0.98] shadow-sm flex items-center justify-center gap-xs">
                    Create Account
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</a>
